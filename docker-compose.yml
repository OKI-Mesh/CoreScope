# All container config lives here. Override defaults via .env or environment variables.
#
# Caddy and Mosquitto are optional and live in override files. Select them in .env:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.caddy.yml:docker-compose.mosquitto.yml
# With neither, the app is published on ${PROD_APP_BIND}:${PROD_APP_PORT} only, which
# suits an external MQTT broker and a tunnel or reverse proxy in front of it.
#
# Postgres data lives in the pgdata named volume. Back it up with pg_dump, not by
# copying files.

services:
  postgres:
    image: imresamu/postgis:18-3.6
    container_name: corescope-postgres
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: corescope
      POSTGRES_DB: corescope
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corescope -d corescope"]
      interval: 5s
      timeout: 5s
      retries: 12

  prod:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: corescope:latest
    container_name: corescope-prod
    restart: unless-stopped
    stop_grace_period: 30s
    stop_signal: SIGTERM
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROD_APP_BIND:-127.0.0.1}:${PROD_APP_PORT:-3000}:3000"
    volumes:
      - ${PROD_DATA_DIR:-~/meshcore-data}:/app/data
    environment:
      NODE_ENV: production
      DISABLE_MOSQUITTO: "true"
      DISABLE_CADDY: "true"
      DATABASE_URL: postgres://corescope:${POSTGRES_PASSWORD}@postgres:5432/corescope
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata: