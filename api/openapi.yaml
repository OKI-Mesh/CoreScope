      additionalProperties: false
      required: [role, unscoped, unknownScope, named]
      properties:
        role: { type: string }
        unscoped: { type: integer }
        unknownScope: { type: integer }
        named: { type: integer }
    ScopeStatsResponse:
      type: object
      additionalProperties: false
      required: [window, summary, byRegion, timeSeries, advertsByRole]
      properties:
        window: { type: string }
        summary: { $ref: '#/components/schemas/ScopeStatsSummary' }
        byRegion:
          type: array
          items: { $ref: '#/components/schemas/ScopeRegionCount' }
        timeSeries:
          type: array
          items: { $ref: '#/components/schemas/ScopeTimePoint' }
        advertsByRole:
          type: array
          items: { $ref: '#/components/schemas/ScopeAdvertRoleCount' }
    ScopeObservation:
      type: object
      description: One region scope a repeater was observed forwarding within the window.
      additionalProperties: false
      required: [scope, packets, firstSeen, lastSeen]
      properties:
        scope: { type: string, description: "Matched region name without a leading #." }
        packets: { type: integer, format: int64 }
        firstSeen: { $ref: '#/components/schemas/TimestampMillis' }
        lastSeen: { $ref: '#/components/schemas/TimestampMillis' }
    ScopeAuditRow:
      type: object
      additionalProperties: false
      required:
        - publicKey
        - name
        - role
        - declaredRegions
        - declaredWildcard
        - configState
        - declaredAt
        - truncated
        - notObserved
        - undeclaredObserved
        - observedUnscopedPackets
        - wildcardContradiction
        - ambiguousHops
        - observedUnmatchedPackets
        - observedUnmatchedSampled
        - regionEvidence
      properties:
        publicKey: { type: string }
        name: { type: [string, "null"], description: "Null when this instance holds no nodes row for the repeater." }
        role:
          oneOf:
            - $ref: '#/components/schemas/NodeRole'
            - { type: "null" }
        declaredRegions:
          type: array
          description: Named regions the repeater declares, without a leading #. The * wildcard is excluded; see declaredWildcard.
          items: { type: string }
        declaredWildcard: { type: boolean, description: "The raw declared list contains *, meaning plain unscoped floods are forwarded." }
        configState: { $ref: '#/components/schemas/ScopeConfigState' }
        declaredAt: { $ref: '#/components/schemas/TimestampSeconds' }
        truncated: { type: boolean, description: The declared list may have had entries dropped. }
        notObserved:
          type: array
          description: Declared regions with no matched forwarding in the window and no corroborating evidence.
          items: { type: string }
        undeclaredObserved:
          type: array
          description: Scopes the repeater was seen forwarding that its declared list omits.
          items: { $ref: '#/components/schemas/ScopeObservation' }
        observedUnscopedPackets: { type: integer, format: int64, description: Plain-flood packets the repeater was seen forwarding. }
        wildcardContradiction: { type: boolean, description: Seen forwarding unscoped floods although its declared list omits *. }
        ambiguousHops:
          type: integer
          format: int64
          description: >-
            Forwarder hops whose prefix also matches another declared repeater.
            A caveat, not a finding: any notObserved entry may be explained by a
            colliding neighbour.
        observedUnmatchedPackets:
          type: integer
          format: int64
          description: >-
            Packets forwarded under a transport scope that matched no region key
            this instance holds. A caveat: a notObserved entry may name a region
            this instance cannot name.
        observedUnmatchedSampled:
          type: integer
          format: int64
          description: >-
            How many of observedUnmatchedPackets verification could look at. The
            difference is an upper bound on unexplained traffic.
        regionEvidence:
          type: object
          description: "Declared region to the number of the repeater's own unmatched packets that derive to it. Empty object when none. A region with enough evidence is dropped from notObserved, so this does not decide the row state; it says how a region was established, and why one with a single hit stayed in notObserved."
          additionalProperties: { type: integer }
    ScopeAuditResponse:
      type: object
      additionalProperties: false
      required: [window, since, repeaters]
      properties:
        window: { type: string }
        since: { $ref: '#/components/schemas/TimestampSeconds' }
        repeaters:
          type: array
          items: { $ref: '#/components/schemas/ScopeAuditRow' }
          
    DecodeRequest:
