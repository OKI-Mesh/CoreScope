openapi: 3.0.3
info:
  title: CoreScope API
  description: MeshCore network analyzer — packet capture, node tracking, and mesh analytics.
  version: 1.0.0
  license:
    name: MIT
tags:
  - name: nodes
    description: Mesh node operations
  - name: analytics
    description: Network analytics and statistics
paths:
  /api/nodes/{pubkey}/neighbors:
    get:
      tags: [nodes]
      operationId: getNodeNeighbors
      summary: Get node neighbors
      description: >-
        Returns the queried node's first-hop neighbors with affinity scores and
        observation metadata (count, SNR, distance, observers). Ambiguous edges
        carry candidate pubkeys. Entries are sorted by score, highest first.
      parameters:
        - name: pubkey
          in: path
          required: true
          description: Public key of the node (hex). Matched case-insensitively.
          schema:
            type: string
        - name: min_count
          in: query
          required: false
          description: Drop neighbors with fewer observations than this. Values below 1 are ignored.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: min_score
          in: query
          required: false
          description: Drop neighbors whose affinity score is below this.
          schema:
            type: number
            format: double
            default: 0
        - name: include_ambiguous
          in: query
          required: false
          description: Set to false to drop edges that could not be resolved to a single node. Any other value keeps them.
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeNeighborsResponse"
        "404":
          description: The node is blacklisted or hidden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/analytics/neighbor-graph:
    get:
      tags: [analytics]
      operationId: getNeighborGraph
      summary: Neighbor graph
      description: >-
        The full neighbor affinity graph, for visualization. The default query
        (min_count=5, min_score=0.1, no region, no role) and the analytics-tab
        query (min_count=1, min_score=0) are served from a snapshot rebuilt in
        the background; every other combination is computed per request.
      parameters:
        - name: min_count
          in: query
          required: false
          description: Drop edges with fewer observations than this. Values below 1 are ignored.
          schema:
            type: integer
            minimum: 1
            default: 5
        - name: min_score
          in: query
          required: false
          description: Drop edges whose affinity score is below this.
          schema:
            type: number
            format: double
            default: 0.1
        - name: region
          in: query
          required: false
          description: Keep only edges seen by at least one observer in this region.
          schema:
            type: string
        - name: role
          in: query
          required: false
          description: Keep only edges where at least one endpoint has this role. Matched case-insensitively.
          schema:
            type: string
      responses:
        "200":
          description: Success
          headers:
            X-Cache-Age-Seconds:
              description: Age of the snapshot in whole seconds. Present only when the response was served from the background snapshot.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NeighborGraphResponse"
components:
  schemas:
    NodeRole:
      type: string
      description: >-
        MeshCore node role. observer marks a standalone observer; unknown marks
        a pubkey seen only in packets and is not a real MeshCore role.
      enum: [repeater, companion, room, sensor, observer, unknown]
      x-go-type: types.NodeRole
      x-go-type-import:
        path: github.com/OKI-Mesh/CoreScope/internal/types
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    NodeNeighborsResponse:
      type: object
      required: [node, neighbors, total_observations]
      properties:
        node:
          type: string
          description: The queried node's public key, lowercased.
        neighbors:
          type: array
          items:
            $ref: "#/components/schemas/NeighborEntry"
        total_observations:
          type: integer
          description: Sum of count over the neighbors returned, before duplicate-prefix merging.
    NeighborEntry:
      type: object
      description: One neighbor of the queried node, with affinity score and observation metadata.
      required:
        - pubkey
        - prefix
        - name
        - role
        - count
        - score
        - first_seen
        - last_seen
        - avg_snr
        - observers
        - ambiguous
      properties:
        pubkey:
          type: string
          nullable: true
          description: Resolved neighbor public key, or null when only a hop prefix is known.
        prefix:
          type: string
          description: Raw hop hash prefix that established this edge.
        name:
          type: string
          nullable: true
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NodeRole"
        count:
          type: integer
          description: Total observations supporting this neighborship.
        counts_by_mode:
          type: object
          x-go-type-skip-optional-pointer: true
          description: Observation counts keyed by hash-prefix size in bytes (1, 2, 3). Key 0 is legacy or unknown. Absent when empty.
          additionalProperties:
            type: integer
        score:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: "Affinity score: count saturation × recency decay × observer-diversity confidence."
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        avg_snr:
          type: number
          format: double
          nullable: true
        distance_km:
          type: number
          format: double
          description: Great-circle distance to the queried node. Absent unless both nodes have a position.
        observers:
          type: array
          items:
            type: string
        ambiguous:
          type: boolean
        unresolved:
          type: boolean
          x-go-type-skip-optional-pointer: true
          description: Present and true when the edge is ambiguous and has no candidates.
        candidates:
          type: array
          x-go-type-skip-optional-pointer: true
          description: Present on ambiguous edges that have candidate nodes.
          items:
            $ref: "#/components/schemas/CandidateEntry"
    CandidateEntry:
      type: object
      description: A candidate node offered when a neighbor edge is ambiguous.
      required: [pubkey, name, role]
      properties:
        pubkey:
          type: string
        name:
          type: string
          description: Empty when the node is not known.
        role:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/NodeRole"
    NeighborGraphResponse:
      type: object
      required: [nodes, edges, stats]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/GraphNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/GraphEdge"
        stats:
          $ref: "#/components/schemas/GraphStats"
    GraphNode:
      type: object
      required: [pubkey, name, role, neighbor_count]
      properties:
        pubkey:
          type: string
        name:
          type: string
          nullable: true
          description: Null when the node is not known.
        role:
          nullable: true
          description: Null when the node is not known.
          allOf:
            - $ref: "#/components/schemas/NodeRole"
        neighbor_count:
          type: integer
          description: Number of returned edges that touch this node.
    GraphEdge:
      type: object
      required: [source, target, weight, score, bidirectional, avg_snr, ambiguous]
      properties:
        source:
          type: string
          description: Public key of one endpoint.
        target:
          type: string
          description: Public key of the other endpoint, or "prefix:" followed by the hop prefix when the edge is ambiguous and unresolved.
        weight:
          type: integer
          description: Observations supporting this edge.
        score:
          type: number
          format: double
        bidirectional:
          type: boolean
        avg_snr:
          type: number
          format: double
          nullable: true
        ambiguous:
          type: boolean
    GraphStats:
      type: object
      required: [total_nodes, total_edges, ambiguous_edges, avg_cluster_size, rejected_edges_geo_far]
      properties:
        total_nodes:
          type: integer
        total_edges:
          type: integer
        ambiguous_edges:
          type: integer
        avg_cluster_size:
          type: number
          format: double
        rejected_edges_geo_far:
          type: integer
          format: int64
          minimum: 0
          description: Edges dropped at build time because the two nodes are implausibly far apart.