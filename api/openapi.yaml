        hops:
          type: array
          items: { $ref: '#/components/schemas/DistancePathHop' }
    CategoryDistStats:
      type: object
      additionalProperties: false
      required: [count, avg, median, min, max]
      properties:
        count: { type: integer }
        avg: { type: number, format: double }
        median: { type: number, format: double }
        min: { type: number, format: double }
        max: { type: number, format: double }
    DistOverTimeEntry:
      type: object
      additionalProperties: false
      required: [hour, avg, count]
      properties:
        hour: { type: string, description: "UTC hour bucket, 2026-11-05T15." }
        avg: { type: number, format: double }
        count: { type: integer }
    DistanceAnalyticsResponse:
      type: object
      additionalProperties: false
      required: [summary, topHops, topPaths, catStats, distHistogram, distOverTime]
      properties:
        summary: { $ref: '#/components/schemas/DistanceSummary' }
        topHops:
          type: array
          description: Longest hop per node pair, at most 20, longest first.
          items: { $ref: '#/components/schemas/DistanceHop' }
        topPaths:
          type: array
          description: The 20 longest paths.
          items: { $ref: '#/components/schemas/DistancePath' }
        catStats:
          type: object
          description: Statistics keyed by endpoint roles (R↔R, C↔R, C↔C).
          additionalProperties: { $ref: '#/components/schemas/CategoryDistStats' }
        distHistogram: { $ref: '#/components/schemas/Histogram' }
        distOverTime:
          type: array
          description: Average distance over time, bucketed by hour.
          items: { $ref: '#/components/schemas/DistOverTimeEntry' }
