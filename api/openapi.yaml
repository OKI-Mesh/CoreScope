        size: { type: integer, description: The prefix length in bytes. }
        count: { type: integer, description: Packets that carried the hop. }
        name: { type: string, nullable: true, description: The node the prefix resolves to; null when unknown. }
        pubkey: { type: string, nullable: true, description: The resolved node's public key; null when unknown. }
    MultiByteNode:
      type: object
      additionalProperties: false
      required: [name, hashSize, packets, lastSeen, pubkey, role]
      properties:
        name: { type: string }
        hashSize: { type: integer, description: The hash size in bytes the node's latest advert declared. }
        packets: { type: integer, description: Adverts counted for the node. }
