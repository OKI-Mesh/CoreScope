    MarkerStroke:
      type: object
      additionalProperties: false
      required: [color, width, opacity]
      properties:
        color: { type: string }
        width: { type: number, format: double }
        opacity: { type: number, format: double }
    ThemeResponse:
      type: object
      additionalProperties: false
      required: [branding, theme, themeDark, nodeColors, typeColors, home, markerStroke]
      properties:
        branding: { $ref: '#/components/schemas/ThemeBranding' }
        theme: { $ref: '#/components/schemas/ThemeColors' }
        themeDark: { $ref: '#/components/schemas/ThemeColors' }
        nodeColors:
          type: object
          description: Marker color by role name.
          additionalProperties: { type: string }
        typeColors:
          type: object
          description: Color by payload type name. REQUEST repeats REQ for older clients.
          additionalProperties: { type: string }
        home: { $ref: '#/components/schemas/HomeConfig' }
        markerStroke: { $ref: '#/components/schemas/MarkerStroke' }
    MetricsSample:
      type: object
      additionalProperties: false
      description: >-
        One metrics sample. The rate fields are null for the first sample, after
        a gap of more than two sample intervals, at a reboot, and when the
        observer did not report the counters.
      required: [timestamp, noise_floor, battery_mv, tx_airtime_pct, rx_airtime_pct, recv_error_rate]
      properties:
        timestamp:
          $ref: '#/components/schemas/TimestampSeconds'
        noise_floor: { type: [number, "null"], format: double }
        battery_mv: { type: [integer, "null"] }
        tx_airtime_pct: { type: [number, "null"], format: double, description: "Share of the interval spent transmitting, 0 to 100." }
        rx_airtime_pct: { type: [number, "null"], format: double, description: "Share of the interval spent receiving, 0 to 100." }
        recv_error_rate: { type: [number, "null"], format: double, description: Receive errors as a percentage of packets received plus errors. }
        is_reboot_sample:
          type: boolean
          description: True when a cumulative counter went down. Absent otherwise.
    ObserverMetricsResponse:
      type: object
      additionalProperties: false
      required: [observer_id, observer_name, reboots, metrics]
      properties:
        observer_id: { type: string, description: "The requested key, lowercased." }
        observer_name: { type: [string, "null"], description: Null when the observer is not known. }
        reboots:
          type: array
          description: Timestamps of the reboot samples.
          items: { $ref: '#/components/schemas/TimestampSeconds' }
        metrics:
          type: array
          items: { $ref: '#/components/schemas/MetricsSample' }
    MetricsSummaryObserver:
      type: object
      additionalProperties: false
      required: [observer_id, observer_name, current_noise_floor, avg_noise_floor_24h, max_noise_floor_24h, battery_mv, sample_count, sparkline]
      properties:
        observer_id: { type: string }
        observer_name: { type: [string, "null"], description: Null when the observer has no name. }
        iata: { type: string, description: Absent when the observer has no airport code. }
        current_noise_floor: { type: [number, "null"], format: double }
        avg_noise_floor_24h: { type: [number, "null"], format: double, description: "Average over the requested window, whatever its length." }
        max_noise_floor_24h: { type: [number, "null"], format: double, description: "Maximum over the requested window, whatever its length." }
        battery_mv: { type: [integer, "null"], description: The latest battery reading. }
        sample_count: { type: integer }
        sparkline:
          type: array
          description: The noise floor of each sample in the window, oldest first; null where a sample did not report one.
          items: { type: [number, "null"], format: double }
    MetricsSummaryResponse:
      type: object
      additionalProperties: false
      required: [observers]
      properties:
        observers:
          type: array
          items: { $ref: '#/components/schemas/MetricsSummaryObserver' }
    ObserverCalibration:
      type: object
      additionalProperties: false
      required: [observerID, offsetSec, samples]
      properties:
        observerID: { type: string }
        offsetSec: { type: number, format: double, description: Positive means the observer clock is ahead. }
        samples: { type: integer, description: Multi-observer packets used to compute the offset. }

    NodeClockSkew:
      type: object
      additionalProperties: false
      required:
        - pubkey
        - meanSkewSec
        - medianSkewSec
        - lastSkewSec
        - recentMedianSkewSec
        - driftPerDaySec
        - severity
        - sampleCount
        - calibrated
        - lastAdvertTS
        - lastObservedTS
        - goodFraction
        - recentBadSampleCount
        - recentSampleCount
      properties:
        pubkey: { type: string }
        meanSkewSec: { type: number, format: double, description: Corrected mean skew; positive means the node is ahead. }
        medianSkewSec: { type: number, format: double }
        lastSkewSec: { type: number, format: double }
        recentMedianSkewSec: { type: number, format: double, description: Median over the most recent samples; drives severity. }
        driftPerDaySec: { type: number, format: double }
        severity: { $ref: '#/components/schemas/SkewSeverity' }
        sampleCount: { type: integer }
        calibrated: { type: boolean, description: True when observer calibration was applied. }
        lastAdvertTS: { type: integer, format: int64, description: Unix epoch seconds of the newest advert timestamp. }
        # Production sends lastObservedTS and the analytics page reads it. The
        # repo's old Go tag said lastObservedTime; the contract follows production.
        lastObservedTS: { type: integer, format: int64, description: Unix epoch seconds of the newest observation. }
        samples:
          type: array
          x-go-type-skip-optional-pointer: true
          description: Time series for sparklines. Absent on fleet entries.
          items: { $ref: '#/components/schemas/SkewSample' }
        goodFraction: { type: number, format: double, description: Fraction of recent samples with absolute skew of an hour or less. }
        recentBadSampleCount: { type: integer }
        recentBadSamples:
          type: [array, "null"]
          x-go-type-skip-optional-pointer: true
          description: Evidence for each recent nonsense timestamp. Production sends null when there are none; the server now omits it.
          items: { $ref: '#/components/schemas/BadSample' }
        recentSampleCount: { type: integer }
        recentHashEvidence:
          type: array
          x-go-type-skip-optional-pointer: true
          description: Absent on fleet entries.
          items: { $ref: '#/components/schemas/HashEvidence' }
        calibrationSummary:
          $ref: '#/components/schemas/CalibrationSummary'
          description: Absent on fleet entries.
        nodeName: { type: string, description: "Fleet entries only, when the node is known." }
        nodeRole:
          description: "Fleet entries only, when the node is known."
          $ref: '#/components/schemas/NodeRole'

    ReachRole:
      type: string
      description: A node role, or empty when the peer is not a known node.
      enum: [repeater, companion, room, sensor, observer, unknown, ""]
      x-go-type: types.NodeRole
      x-go-type-import:
        path: github.com/OKI-Mesh/CoreScope/internal/types

    ReachNode:
      type: object
      additionalProperties: false
      required: [pubkey, name, role, lat, lon]
      properties:
        pubkey: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/ReachRole' }
        lat: { type: [number, "null"], format: double }
        lon: { type: [number, "null"], format: double }
        first_seen:
          description: Omitted when the node has no recorded first-seen.
          $ref: '#/components/schemas/TimestampSeconds'
        default_scope: { type: string, description: "Inferred from the transport scope of observed adverts. Omitted when unknown." }
        configured_scope: { type: string, description: "Confirmed by an observer neighbors report. Omitted when never confirmed." }
        configured_scope_at:
          description: When the configured scope was confirmed. Omitted with configured_scope.
          $ref: '#/components/schemas/TimestampSeconds'

    ReachWindow:
      type: object
      additionalProperties: false
      required: [days, since]
      properties:
        days: { type: integer, description: "The clamped window, 1..30." }
        since: { $ref: '#/components/schemas/TimestampSeconds' }

    ReachImportance:
      type: object
      additionalProperties: false
      required: [neighbor_degree, degree_rank, nodes_with_edges, relay_observations, bidirectional_links, direct_observers]
      properties:
        neighbor_degree: { type: integer }
        degree_rank: { type: integer, description: "0 when the node has no neighbor edges." }
        nodes_with_edges: { type: integer }
        relay_observations: { type: integer, description: "Observations whose path includes this node. 200000 means the scan was capped." }
        bidirectional_links: { type: integer }
        direct_observers: { type: integer }

    ReachObserver:
      type: object
      additionalProperties: false
      required: [pubkey, name, count, avg_snr, lat, lon, distance_km]
      properties:
        pubkey: { type: string }
        name: { type: string }
        count: { type: integer }
        avg_snr: { type: [number, "null"], format: double }
        lat: { type: [number, "null"], format: double }
        lon: { type: [number, "null"], format: double }
        distance_km: { type: [number, "null"], format: double }

    ReachLink:
      type: object
      additionalProperties: false
      required: [pubkey, name, role, lat, lon, we_hear, they_hear, bottleneck, bidir, distance_km]
      properties:
        pubkey: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/ReachRole' }
        lat: { type: [number, "null"], format: double }
        lon: { type: [number, "null"], format: double }
        we_hear: { type: integer }
        they_hear: { type: integer }
        bottleneck: { type: integer, description: The smaller of we_hear and they_hear. }
        bidir: { type: boolean }
        distance_km: { type: [number, "null"], format: double }

    NodeReachResponse:
      type: object
      additionalProperties: false
      required: [node, window, reliable_tokens, importance, direct_observers, links]
      properties:
        node: { $ref: '#/components/schemas/ReachNode' }
        window: { $ref: '#/components/schemas/ReachWindow' }
        reliable_tokens:
          type: array
          description: Uppercase hex hop prefixes that identify this node uniquely among relays.
          items: { type: string }
        importance: { $ref: '#/components/schemas/ReachImportance' }
        direct_observers:
          type: array
          items: { $ref: '#/components/schemas/ReachObserver' }
        links:
          type: array
          items: { $ref: '#/components/schemas/ReachLink' }

    PacketObservation:
      type: object
      additionalProperties: false
      description: One observer's copy of a packet, as nested inside a packet.
      required: [id, observer_id, observer_name, observer_iata, direction, snr, rssi, path_json, timestamp]
      properties:
        id: { type: integer }
        observer_id: { type: [string, "null"] }
        observer_name: { type: [string, "null"] }
        observer_iata: { type: [string, "null"] }
        direction: { type: [string, "null"] }
        snr: { type: [number, "null"], format: double }
        rssi: { type: [number, "null"], format: double }
        path_json: { type: [string, "null"] }
        timestamp: { $ref: '#/components/schemas/TimestampMillis' }
        resolved_path:
          type: array
          items: { type: [string, "null"] }
    Packet:
      description: >-
        A packet with the display fields of its representative observation.
        observations is present only when requested (expand=observations) or
        on the detail route.
      allOf:
        - $ref: '#/components/schemas/PacketCore'
        - type: object
          required: [_parsedPath]
          properties:
            _parsedPath:
              type: [array, "null"]
              description: Hop prefixes of the representative observation, null when it has none.
              items: { type: string }
            observations:
              type: array
              items: { $ref: '#/components/schemas/PacketObservation' }
    GroupedPacket:
      type: object
      additionalProperties: false
      description: One row of the groupByHash=true list.
      required:
        [hash, first_seen, latest, count, observer_count, observation_count, observer_id, observer_name, observer_iata, distinct_iatas, path_json, payload_type, route_type, raw_hex, decoded_json, snr, rssi, scope_name]
      properties:
        hash: { type: [string, "null"] }
        first_seen:
          oneOf:
            - $ref: '#/components/schemas/TimestampSeconds'
            - type: "null"
        latest:
          oneOf:
            - $ref: '#/components/schemas/TimestampSeconds'
            - type: "null"
        count: { type: integer, description: Same value as observation_count. }
        observer_count: { type: integer }
        observation_count: { type: integer }
        observer_id: { type: [string, "null"] }
        observer_name: { type: [string, "null"] }
        observer_iata: { type: [string, "null"] }
        distinct_iatas:
          type: array
          description: Distinct observer IATA codes across all observations.
          items: { type: string }
        path_json: { type: [string, "null"] }
        payload_type:
          type: [integer, "null"]
          x-go-type: types.PayloadType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        route_type:
          type: [integer, "null"]
          x-go-type: types.RouteType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        raw_hex: { type: [string, "null"] }
        decoded_json: { type: [string, "null"] }
        snr: { type: [number, "null"], format: double }
        rssi: { type: [number, "null"], format: double }
        scope_name: { type: [string, "null"] }
    PacketListResponse:
      type: object
      additionalProperties: false
      required: [packets, total, limit, offset]
      properties:
        packets:
          type: array
          items: { $ref: '#/components/schemas/Packet' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    GroupedPacketListResponse:
      type: object
      additionalProperties: false
      required: [packets, total, limit, offset]
      properties:
        packets:
          type: array
          items: { $ref: '#/components/schemas/GroupedPacket' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    ObservationDetail:
      type: object
      additionalProperties: false
      description: One observation with its packet's hash and the frame it carried.
      required: [id, observer_id, observer_name, observer_iata, snr, rssi, path_json, timestamp]
      properties:
        id: { type: integer }
        hash: { type: string }
        observer_id: { type: [string, "null"] }
        observer_name: { type: [string, "null"] }
        observer_iata: { type: [string, "null"] }
        snr: { type: [number, "null"], format: double }
        rssi: { type: [number, "null"], format: double }
        path_json: { type: [string, "null"] }
        resolved_path:
          type: array
          items: { type: [string, "null"] }
        direction: { type: string }
        raw_hex: { type: string }
        timestamp: { $ref: '#/components/schemas/TimestampMillis' }
    ObservationPacket:
      type: object
      additionalProperties: false
      description: >-
        What /api/packets/{id} returns as packet when id is an observation id:
        the observation with its packet's payload fields. hash, raw_hex,
        payload_type, route_type and decoded_json are absent when the packet is
        no longer in memory.
      required: [id, observer_id, observer_name, observer_iata, direction, snr, rssi, score, path_json, timestamp]
      properties:
        id: { type: integer, description: The observation id. }
        hash: { type: string }
        raw_hex: { type: string }
        decoded_json: { type: string }
        payload_type:
          type: integer
          x-go-type: types.PayloadType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        route_type:
          type: integer
          x-go-type: types.RouteType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        observer_id: { type: [string, "null"] }
        observer_name: { type: [string, "null"] }
        observer_iata: { type: [string, "null"] }
        direction: { type: [string, "null"] }
        snr: { type: [number, "null"], format: double }
        rssi: { type: [number, "null"], format: double }
        score: { type: [number, "null"], format: double }
        path_json: { type: [string, "null"] }
        resolved_path:
          type: array
          items: { type: [string, "null"] }
        timestamp: { $ref: '#/components/schemas/TimestampMillis' }
    PacketDetailResponse:
      type: object
      additionalProperties: false
      required: [packet, path, observation_count]
      properties:
        packet:
          description: >-
            Packet when id was a hash or a transmission id, ObservationPacket
            when it was an observation id.
          # Follow-up: give the observation-id lookup its own route so this
          # field stops being a union.
          oneOf:
            - $ref: '#/components/schemas/Packet'
            - $ref: '#/components/schemas/ObservationPacket'
        path:
          type: array
          description: Hop prefixes parsed from the packet's path_json; empty when it has none.
          items: { type: string }
        observation_count: { type: integer, description: "Number of observations returned, or 1 when none are known." }
        observations:
          type: array
          description: Omitted when empty.
          items: { $ref: '#/components/schemas/ObservationDetail' }
    ObservationBatchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: object
          description: Observations keyed by packet hash, exactly as requested.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/ObservationDetail' }
    AttributionMethod:
      type: string
      description: >-
        observer: multi-byte nodes are attributed to the observers that heard
        them. repeater: to the repeater's home region, used whenever a region
        filter is given.
      enum: [observer, repeater]
    CapabilityStatus:
      type: string
      description: >-
        confirmed: an advert declared a size of 2 or more. suspected: the
        node's prefix appeared in a multi-byte path. unknown: only 1-byte
        evidence.
      enum: [confirmed, suspected, unknown]
    CapabilityEvidence:
      type: string
      description: What the capability status rests on. Empty when the status is unknown.
      enum: [advert, path, ""]
    CollisionClass:
      type: string
      description: >-
        local: under 50 km. regional: under 200 km. distant: farther.
        incomplete: fewer than two positioned nodes.
      enum: [local, regional, distant, incomplete, unknown]
    HashSizeHourly:
      type: object
      additionalProperties: false
      required: ["hour", "1", "2", "3"]
      properties:
        hour: { type: string, description: "UTC hour bucket, 2026-11-05T15." }
        "1": { type: integer, description: Packets with 1-byte hashes. }
        "2": { type: integer, description: Packets with 2-byte hashes. }
        "3": { type: integer, description: Packets with 3-byte hashes. }
    HashSizeHop:
      type: object
      additionalProperties: false
      required: [hex, size, count, name, pubkey]
      properties:
        hex: { type: string, description: The hop's hash prefix as hex. }
        size: { type: integer, description: The prefix length in bytes. }
        count: { type: integer, description: Packets that carried the hop. }
        name: { type: [string, "null"], description: The node the prefix resolves to; null when unknown. }
        pubkey: { type: [string, "null"], description: The resolved node's public key; null when unknown. }
    MultiByteNode:
      type: object
      additionalProperties: false
      required: [name, hashSize, packets, lastSeen, pubkey, role]
      properties:
        name: { type: string }
