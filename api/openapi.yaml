        ctrlLength: { type: integer }
        ctrlSubtype: { type: string }
        ctrlFilter: { type: integer }
        ctrlTag: { type: integer, format: int64, minimum: 0 }
        ctrlSince: { type: integer, format: int64, minimum: 0 }
        ctrlNodeType: { type: integer }
        ctrlSNR: { type: integer }
        ctrlPubKey: { type: string }
        rawLength: { type: integer }
        firstByteTag: { type: string }
    DecodedPacket:
