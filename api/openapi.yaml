        degree_rank: { type: integer, description: "0 when the node has no neighbor edges." }
        nodes_with_edges: { type: integer }
        relay_observations: { type: integer, description: "Observations whose path includes this node. 200000 means the scan was capped." }
        bidirectional_links: { type: integer }
        direct_observers: { type: integer }

    ReachObserver:
      type: object
      additionalProperties: false
      required: [pubkey, name, count, avg_snr, lat, lon, distance_km]
      properties:
        pubkey: { type: string }
        name: { type: string }
        count: { type: integer }
        avg_snr: { type: number, format: double, nullable: true }
        lat: { type: number, format: double, nullable: true }
        lon: { type: number, format: double, nullable: true }
        distance_km: { type: number, format: double, nullable: true }

    ReachLink:
      type: object
      additionalProperties: false
      required: [pubkey, name, role, lat, lon, we_hear, they_hear, bottleneck, bidir, distance_km]
      properties:
        pubkey: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/ReachRole' }
        lat: { type: number, format: double, nullable: true }
        lon: { type: number, format: double, nullable: true }
        we_hear: { type: integer }
        they_hear: { type: integer }
        bottleneck: { type: integer, description: The smaller of we_hear and they_hear. }
        bidir: { type: boolean }
        distance_km: { type: number, format: double, nullable: true }

    NodeReachResponse:
      type: object
      additionalProperties: false
      required: [node, window, reliable_tokens, importance, direct_observers, links]
      properties:
        node: { $ref: '#/components/schemas/ReachNode' }
        window: { $ref: '#/components/schemas/ReachWindow' }
        reliable_tokens:
          type: array
          description: Uppercase hex hop prefixes that identify this node uniquely among relays.
          items: { type: string }
        importance: { $ref: '#/components/schemas/ReachImportance' }
        direct_observers:
          type: array
          items: { $ref: '#/components/schemas/ReachObserver' }
        links:
          type: array
          items: { $ref: '#/components/schemas/ReachLink' }

    PacketObservation:
      type: object
      additionalProperties: false
      description: One observer's copy of a packet, as nested inside a packet.
      required: [id, observer_id, observer_name, observer_iata, direction, snr, rssi, path_json, timestamp]
      properties:
        id: { type: integer }
        observer_id: { type: string, nullable: true }
        observer_name: { type: string, nullable: true }
        observer_iata: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        snr: { type: number, format: double, nullable: true }
        rssi: { type: number, format: double, nullable: true }
        path_json: { type: string, nullable: true }
        timestamp: { $ref: '#/components/schemas/TimestampMillis' }
        resolved_path:
          type: array
          items: { type: string, nullable: true }
    Packet:
      description: >-
        A packet with the display fields of its representative observation.
        observations is present only when requested (expand=observations) or
        on the detail route.
      allOf:
        - $ref: '#/components/schemas/PacketCore'
        - type: object
          required: [_parsedPath]
          properties:
            _parsedPath:
              type: array
              nullable: true
              description: Hop prefixes of the representative observation, null when it has none.
              items: { type: string }
            observations:
              type: array
              items: { $ref: '#/components/schemas/PacketObservation' }
    GroupedPacket:
      type: object
      additionalProperties: false
      description: One row of the groupByHash=true list.
      required:
        [hash, first_seen, latest, count, observer_count, observation_count, observer_id, observer_name, observer_iata, distinct_iatas, path_json, payload_type, route_type, raw_hex, decoded_json, snr, rssi, scope_name]
      properties:
        hash: { type: string, nullable: true }
        first_seen:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TimestampSeconds' }]
        latest:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/TimestampSeconds' }]
        count: { type: integer, description: Same value as observation_count. }
        observer_count: { type: integer }
        observation_count: { type: integer }
        observer_id: { type: string, nullable: true }
        observer_name: { type: string, nullable: true }
        observer_iata: { type: string, nullable: true }
        distinct_iatas:
          type: array
          description: Distinct observer IATA codes across all observations.
          items: { type: string }
        path_json: { type: string, nullable: true }
        payload_type:
          type: integer
          nullable: true
          x-go-type: types.PayloadType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        route_type:
          type: integer
          nullable: true
          x-go-type: types.RouteType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        raw_hex: { type: string, nullable: true }
        decoded_json: { type: string, nullable: true }
        snr: { type: number, format: double, nullable: true }
        rssi: { type: number, format: double, nullable: true }
        scope_name: { type: string, nullable: true }
    PacketListResponse:
      type: object
      additionalProperties: false
      required: [packets, total, limit, offset]
      properties:
        packets:
          type: array
          items: { $ref: '#/components/schemas/Packet' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    GroupedPacketListResponse:
      type: object
      additionalProperties: false
      required: [packets, total, limit, offset]
      properties:
        packets:
          type: array
          items: { $ref: '#/components/schemas/GroupedPacket' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    ObservationDetail:
      type: object
      additionalProperties: false
      description: One observation with its packet's hash and the frame it carried.
      required: [id, observer_id, observer_name, observer_iata, snr, rssi, path_json, timestamp]
      properties:
        id: { type: integer }
        hash: { type: string }
        observer_id: { type: string, nullable: true }
        observer_name: { type: string, nullable: true }
        observer_iata: { type: string, nullable: true }
        snr: { type: number, format: double, nullable: true }
        rssi: { type: number, format: double, nullable: true }
        path_json: { type: string, nullable: true }
        resolved_path:
          type: array
          items: { type: string, nullable: true }
        direction: { type: string }
        raw_hex: { type: string }
        timestamp: { $ref: '#/components/schemas/TimestampMillis' }
    ObservationPacket:
      type: object
      additionalProperties: false
      description: >-
        What /api/packets/{id} returns as packet when id is an observation id:
