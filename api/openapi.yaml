        prefix: { type: string, description: "The heard key: a 2 or 3 byte prefix or a full pubkey." }
        name: { type: string, description: Present only when the key resolved to exactly one known node. }
        snr: { type: [number, "null"], format: double, description: "SNR of the node's most recent reception in the cell. Null when heard without a signal metric." }
        count: { type: integer }
    CoverageProperties:
      type: object
