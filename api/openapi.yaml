        ackRand: { type: integer }
        pubKey: { type: string }
        timestamp: { type: integer, format: int64, minimum: 0, description: Advert timestamp in Unix seconds. }
        timestampISO: { type: string }
        signature: { type: string }
        signatureValid: { type: boolean }
        flags: { $ref: '#/components/schemas/DecodedAdvertFlags' }
        lat: { type: number, format: double }
