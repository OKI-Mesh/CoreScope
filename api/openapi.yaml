      properties:
        type: { type: string, description: Always FeatureCollection. }
        features:
          type: array
          items: { $ref: '#/components/schemas/CoverageFeature' }
        truncated: { type: boolean, description: Present only when true. The cell list was capped at 5000. }
        mobile_receptions: { type: integer, description: "Per-node route only; absent when zero. All mobile receptions of the node." }
        mobile_clients: { type: integer, description: "Per-node route only; absent when zero. Distinct clients that heard the node." }
    RxLeaderboardObserver:
