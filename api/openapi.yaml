        propagationBufferMs: { type: number, format: double }
        liveMapMaxNodes: { type: integer }
        timestamps: { $ref: '#/components/schemas/TimestampConfig' }
        debugAffinity: { type: boolean, description: Present only when true. }
        mapDarkTileProvider: { type: string, deprecated: true, description: Present only when set. }
        customizer: { $ref: '#/components/schemas/CustomizerClientConfig' }
        clientRxCoverage: { type: boolean }
