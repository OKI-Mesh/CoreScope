      properties:
        pubkey: { type: string }
        name: { type: string, description: "Empty when the observer is unnamed, blacklisted or hidden." }
        receptions: { type: integer }
        nodes: { type: integer, description: Distinct nodes heard. }
        cells: { type: integer, description: Distinct fixed-resolution hex cells covered. }
        score: { type: number, format: double, description: Frontier-weighted coverage score. }
    RxLeaderboardResponse:
      type: object
      additionalProperties: false
      required: [days, observers]
      properties:
        days: { type: integer, description: The clamped window. }
        observers:
          type: array
          items: { $ref: '#/components/schemas/RxLeaderboardObserver' }
    ScopeStatsSummary:
      type: object
      additionalProperties: false
      required: [transportTotal, scoped, unscoped, unknownScope]
      properties:
        transportTotal: { type: integer }
        scoped: { type: integer, description: Transport packets whose scope matched a region this instance holds. }
        unscoped: { type: integer }
        unknownScope: { type: integer, description: Transport packets whose scope matched no region this instance holds. }
    ScopeRegionCount:
      type: object
      additionalProperties: false
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    ScopeTimePoint:
      type: object
      additionalProperties: false
      required: [t, scoped, unscoped]
      properties:
        t: { $ref: '#/components/schemas/TimestampSeconds' }
        scoped: { type: integer }
        unscoped: { type: integer }
    ScopeAdvertRoleCount:
      type: object
