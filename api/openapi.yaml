          items: { type: integer }
    HashCollision:
      type: object
      additionalProperties: false
      required: [prefix, byte_size, appearances, nodes, max_dist_km, classification, with_coords]
      properties:
        prefix: { type: string, description: The shared prefix as uppercase hex. }
        byte_size: { type: integer }
        appearances: { type: integer, description: Nodes sharing the prefix. }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/HashCollisionNode' }
        max_dist_km: { type: number, format: double, description: Largest distance between two positioned nodes in the group. }
        classification: { $ref: '#/components/schemas/CollisionClass' }
