      required: [id, observer_id, observer_name, observer_iata, direction, snr, rssi, score, path_json, timestamp]
      properties:
        id: { type: integer, description: The observation id. }
        hash: { type: string }
        raw_hex: { type: string }
        decoded_json: { type: string }
        payload_type:
          type: integer
          x-go-type: types.PayloadType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        route_type:
          type: integer
          x-go-type: types.RouteType
          x-go-type-import: { path: github.com/OKI-Mesh/CoreScope/internal/types }
        observer_id: { type: string, nullable: true }
        observer_name: { type: string, nullable: true }
        observer_iata: { type: string, nullable: true }
        direction: { type: string, nullable: true }
        snr: { type: number, format: double, nullable: true }
        rssi: { type: number, format: double, nullable: true }
        score: { type: number, format: double, nullable: true }
        path_json: { type: string, nullable: true }
        resolved_path:
          type: array
          items: { type: string, nullable: true }
        timestamp: { $ref: '#/components/schemas/TimestampMillis' }
    PacketDetailResponse:
      type: object
      additionalProperties: false
      required: [packet, path, observation_count]
      properties:
        packet:
          description: >-
            Packet when id was a hash or a transmission id, ObservationPacket
            when it was an observation id.
          # Follow-up: give the observation-id lookup its own route so this
          # field stops being a union.
          oneOf:
            - $ref: '#/components/schemas/Packet'
            - $ref: '#/components/schemas/ObservationPacket'
        path:
          type: array
          description: Hop prefixes parsed from the packet's path_json; empty when it has none.
          items: { type: string }
        observation_count: { type: integer, description: "Number of observations returned, or 1 when none are known." }
        observations:
          type: array
          description: Omitted when empty.
          items: { $ref: '#/components/schemas/ObservationDetail' }
    ObservationBatchResponse:
      type: object
      additionalProperties: false
      required: [results]
      properties:
        results:
          type: object
          description: Observations keyed by packet hash, exactly as requested.
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/ObservationDetail' }
    AttributionMethod:
      type: string
      description: >-
        observer: multi-byte nodes are attributed to the observers that heard
        them. repeater: to the repeater's home region, used whenever a region
        filter is given.
      enum: [observer, repeater]
    CapabilityStatus:
      type: string
      description: >-
        confirmed: an advert declared a size of 2 or more. suspected: the
        node's prefix appeared in a multi-byte path. unknown: only 1-byte
        evidence.
      enum: [confirmed, suspected, unknown]
    CapabilityEvidence:
      type: string
      description: What the capability status rests on. Empty when the status is unknown.
      enum: [advert, path, ""]
    CollisionClass:
      type: string
      description: >-
        local: under 50 km. regional: under 200 km. distant: farther.
        incomplete: fewer than two positioned nodes.
      enum: [local, regional, distant, incomplete, unknown]
