      properties:
        total_nodes: { type: integer }
        nodes_for_byte: { type: integer, description: Nodes counted for this prefix size. }
        using_this_size: { type: integer, description: Nodes whose declared hash size is this size. }
        unique_prefixes: { type: integer }
        collision_count: { type: integer }
        space_size: { type: integer, description: Possible prefixes at this size. }
        pct_used: { type: number, format: double, description: Percent of the prefix space in use. }
    TwoByteCell:
