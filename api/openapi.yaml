      required: [accent, accentHover, navBg, navBg2, navText, navTextMuted, background, text, textMuted, border, surface1, surface2, surface3, sectionBg, cardBg, contentBg, detailBg, inputBg, rowStripe, rowHover, selectedBg, statusGreen, statusYellow, statusRed]
      properties:
        accent: { type: string }
        accentHover: { type: string }
        navBg: { type: string }
        navBg2: { type: string }
        navText: { type: string }
        navTextMuted: { type: string }
        navActiveBg: { type: string }
        background: { type: string }
        text: { type: string }
        textMuted: { type: string }
        border: { type: string }
        surface1: { type: string }
        surface2: { type: string }
        surface3: { type: string }
        sectionBg: { type: string }
        cardBg: { type: string }
        contentBg: { type: string }
        detailBg: { type: string }
        inputBg: { type: string }
        rowStripe: { type: string }
        rowHover: { type: string }
        selectedBg: { type: string }
        statusGreen: { type: string }
        statusYellow: { type: string }
        statusRed: { type: string }
        font: { type: string }
        mono: { type: string }
    HomeStep:
      type: object
      additionalProperties: false
      required: [emoji, title, description]
      properties:
        emoji: { type: string, description: "A ph:name icon token or a literal emoji." }
