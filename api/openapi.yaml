        pubkey: { type: string }
        role: { $ref: '#/components/schemas/NodeRole' }
    MultiByteCapability:
      type: object
      additionalProperties: false
      required: [pubkey, name, role, status, evidence, maxHashSize, lastSeen]
      properties:
        pubkey: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/NodeRole' }
        status: { $ref: '#/components/schemas/CapabilityStatus' }
        evidence: { $ref: '#/components/schemas/CapabilityEvidence' }
        maxHashSize: { type: integer }
        lastSeen: { $ref: '#/components/schemas/TimestampSeconds' }
    HashSizeAnalyticsResponse:
      type: object
      additionalProperties: false
      required:
        - attributionMethod
        - total
        - distribution
        - distributionByRepeaters
        - hourly
        - topHops
        - multiByteNodes
        - multiByteCapability
      properties:
        attributionMethod: { $ref: '#/components/schemas/AttributionMethod' }
        total:
          type: integer
          description: Packets with at least one relay hop.
        distribution:
          type: object
          description: Packets per hash size in bytes, keys 1 to 3.
          additionalProperties: { type: integer }
        distributionByRepeaters:
          type: object
          description: Repeaters per hash size in bytes. Key 0 counts repeaters whose size could not be read.
          additionalProperties: { type: integer }
        hourly:
          type: array
          items: { $ref: '#/components/schemas/HashSizeHourly' }
        topHops:
          type: array
          description: The 50 most frequent hops.
          items: { $ref: '#/components/schemas/HashSizeHop' }
        multiByteNodes:
          type: array
          description: Nodes advertising 2-byte or 3-byte hashes, busiest first.
          items: { $ref: '#/components/schemas/MultiByteNode' }
        multiByteCapability:
          type: array
          items: { $ref: '#/components/schemas/MultiByteCapability' }
    HashCollisionNode:
      type: object
      additionalProperties: false
      required: [public_key, name, role, lat, lon, hash_size, hash_size_inconsistent]
      properties:
        public_key: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/NodeRole' }
        lat: { type: number, format: double, description: 0 when the node has no position. }
        lon: { type: number, format: double, description: 0 when the node has no position. }
        hash_size: { type: integer }
        hash_size_inconsistent: { type: boolean }
        hash_sizes_seen:
