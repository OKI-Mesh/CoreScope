      properties:
        heroTitle: { type: string }
        heroSubtitle: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/HomeStep' }
        footerLinks:
          type: array
          items: { $ref: '#/components/schemas/HomeLink' }
