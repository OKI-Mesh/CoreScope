        has_sig: { type: boolean, description: "False when no reception in the cell carried a signal metric." }
        nodes:
          type: array
          description: Per-node breakdown, strongest latest SNR first. At most 25.
          items: { $ref: '#/components/schemas/CoverageNode' }
        nodes_truncated: { type: boolean, description: Present only when true. }
    CoverageFeature:
      type: object
